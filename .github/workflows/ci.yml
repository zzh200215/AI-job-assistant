name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: development
      APP_DEBUG: "false"
      AUTO_CREATE_TABLES: "true"
      JWT_SECRET: replace-with-a-random-32-plus-character-secret
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint backend
        run: ruff check .
        continue-on-error: true

      - name: Run backend tests
        run: python -m pytest

      - name: Validate Alembic migrations
        env:
          DATABASE_URL: sqlite:///./ci_migration_check.sqlite3
        run: |
          rm -f ci_migration_check.sqlite3
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini current

      - name: Dependency vulnerability audit
        run: pip-audit --desc --requirement requirements.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Lint frontend
        run: npm run lint
        continue-on-error: true

      - name: Check frontend formatting
        run: npm run format:check
        continue-on-error: true

      - name: Build frontend
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  docker-security:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: recruit-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: recruit-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: recruit-backend:ci
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: recruit-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: trivy-*.sarif
