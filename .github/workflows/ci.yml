name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: development
      APP_DEBUG: "false"
      AUTO_CREATE_TABLES: "true"
      JWT_SECRET: replace-with-a-random-32-plus-character-secret
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint backend
        run: ruff check .

      - name: Check backend formatting
        run: ruff format --check .

      - name: Run backend tests
        run: python -m pytest

      - name: Validate Alembic migrations (T1-3)
        env:
          DATABASE_URL: sqlite:///./ci_migration_check.sqlite3
        run: |
          rm -f ci_migration_check.sqlite3
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini current
          python -m alembic -c alembic.ini check

      - name: Check schema baseline drift (T1-2)
        run: python scripts/export_schema_baseline.py --check

      # 这道门要查检索，就得有个能查的库。CI 没有 MySQL，干净检出的 chroma_db 是空的，
      # 所以先用仓库自带的 docs/knowledge-seeds 走一遍真实入库链路，把语料装进一次性
      # SQLite + 临时 Chroma。embedding 仍是 mock：向量没有语义，语义门槛只能门窗法那一路。
      - name: Seed scratch knowledge corpus for the RAG gate
        env:
          DATABASE_URL: sqlite:///./rag_ci.sqlite3
          CHROMA_DIR: ./rag_ci_chroma
        run: |
          rm -f rag_ci.sqlite3
          rm -rf rag_ci_chroma
          python scripts/seed_rag_corpus.py

      - name: Run RAG eval (lexical recall / keyword-hit >= 0.7, no empty retrieval)
        env:
          DATABASE_URL: sqlite:///./rag_ci.sqlite3
          CHROMA_DIR: ./rag_ci_chroma
        run: >
          python scripts/eval_rag.py
          --min-lexical-recall 0.7
          --min-lexical-keyword-hit 0.7
          --max-empty-results 0

      # 推荐解释层与技能权威（skill_gap 的 canonical 集合运算）是否一致。标签由规则派生，
      # 这一步又没有 LLM、没有线上数据参与，所以正确答案就是"完全一致"：门槛设 1.0，
      # 任何偏离都是一次真实的语义变更。（脚本每次还会算出"不看系统的笨猜测最高只有
      # 0.676 / 0.38"，门槛赢不了它就红。）
      # 同一份一次性 SQLite（上面 seed 那步建的表）当会话库，让线上反馈那一臂有表可读。
      - name: Run Recommend eval (explanation layer must equal the skill_gap rule)
        env:
          DATABASE_URL: sqlite:///./rag_ci.sqlite3
        run: >
          python scripts/eval_recommend.py
          --min-skill-match-accuracy 1.0
          --min-explanation-consistency 1.0

      # mock provider 的分数没有语义，所以这里**不设质量门槛**，只门管道：每条 pair 都要
      # 跑出预测分（--max-errors 0）。质量门槛在 scripts/eval-quality.ps1（真 provider）那边，
      # 且必须先赢过脚本自己算出的"不用模型的基线"才算门槛。
      - name: Run Agent eval (plumbing only - every pair must produce a score)
        env:
          DATABASE_URL: sqlite:///./rag_ci.sqlite3
        run: python scripts/eval_agent.py --max-errors 0

      - name: Dependency vulnerability audit
        run: pip-audit --desc --requirement requirements.txt

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      # `npm test` 只跑 node --test 的冒烟集；Vitest 那套（样式债棘轮、scoreTone 等
      # 单测）此前没有任何一步执行它——写了门却没接上。
      - name: Run frontend unit tests (vitest)
        run: npm run test:unit

      - name: Lint frontend
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format:check

      - name: Build frontend
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=moderate

  docker-security:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: recruit-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: recruit-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: recruit-backend:ci
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: recruit-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: trivy-*.sarif
