# Prometheus configuration for Smart Recruitment Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'recruitment-platform'
    scrape_interval: 15s
    metrics_path: '/api/system/metrics'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'smart-recruitment-backend'
          environment: 'production'
