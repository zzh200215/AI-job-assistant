[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=0
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead\.:DeprecationWarning
